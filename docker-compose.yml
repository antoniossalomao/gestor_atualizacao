# Sobe o painel com "docker compose up -d", a partir desta pasta (web/).
# Instruções completas -- inclusive os passos obrigatórios antes do primeiro
# "up": o server/.env e o GESTOR_ENDERECO no web/.env -- nas seções "Rodar em
# Docker" e "HTTPS" do README.md.
#
# Somente HTTPS: o painel (gestor) não publica porta nenhuma; quem atende a
# rede é o proxy (Caddy), na 443. Ver P01 em docs/MELHORIAS.md.

services:
  gestor:
    build:
      # "." é a pasta web/ inteira, e não server/, porque o
      # server/package.json depende do package.json da raiz (ver o
      # comentário no topo do Dockerfile).
      context: .
    image: gestor-de-atualizacoes:local
    container_name: gestor-de-atualizacoes

    # O container volta sozinho depois de um travamento e depois de a máquina
    # reiniciar. "unless-stopped" (e não "always") para que um "docker
    # compose stop" feito de propósito continue valendo depois do reboot.
    restart: unless-stopped

    # Um init de verdade como PID 1. O server.js já trata SIGTERM para
    # fechar o SQLite de forma organizada (ver o final de server.js), e isto
    # garante que o sinal do "docker compose stop" chegue nele, além de
    # recolher processos filhos órfãos.
    init: true

    # SEM "ports:", de propósito: a porta do Node não é publicada, e só o
    # proxy, pela rede interna do compose, alcança o painel. Isso é o que
    # impede um http://IP:3000 aberto na rede e o que torna seguro o
    # TRUST_PROXY=true abaixo -- com a porta aberta, quem batesse nela
    # poderia mandar um "X-Forwarded-Proto: https" inventado.

    environment:
      # PORT, SESSION_SECURE e TRUST_PROXY moram aqui, e não no server/.env,
      # porque dependem do desenho DESTE arquivo: o proxy encaminha para a
      # 3000, termina o HTTPS e é o único na frente do Node. Mudar qualquer
      # um sem mudar o resto quebra o acesso (ou a segurança); por isso não
      # ficam onde se ajusta caso a caso. O dotenv não sobrescreve o que já
      # veio do ambiente, então estes valem mesmo que o server/.env diga
      # outra coisa. O resto do .env é infraestrutura e segredos. As regras
      # da equipe (URL pública, webhook do Discord, intervalos) não são mais
      # variável de ambiente nenhuma: moram no banco e se editam na tela
      # Administração.
      PORT: 3000
      SESSION_SECURE: "true"
      TRUST_PROXY: "true"

    volumes:
      # Dados reais, o que não pode se perder ao trocar a imagem: gestao.db,
      # sessions.sqlite, backups/ e os pacotes de instalação enviados pelo
      # painel. Volume NOMEADO, e não uma pasta do Windows: o SQLite em modo
      # WAL depende de travas de arquivo que não funcionam de forma
      # confiável através da tradução de sistema de arquivos do Docker
      # Desktop (e muito menos sobre pasta de rede). Para tirar uma cópia de
      # fora, use o download de backup do próprio painel -- ele existe
      # justamente para isso.
      - gestor-data:/app/server/data

      # O .env é montado como ARQUIVO e SÓ LEITURA (":ro"): nada no painel
      # escreve nele desde que as regras da equipe foram para o banco. Não
      # vai embutido na imagem porque imagem se copia e se publica, e ele
      # tem o SESSION_SECRET e a AGENT_API_TOKEN.
      #
      # Ele PRECISA existir antes do primeiro "up": quando o caminho de
      # origem não existe, o Docker cria uma PASTA vazia com esse nome, e aí
      # não há SESSION_SECRET -- o servidor se recusa a subir e o container
      # fica reiniciando, com o motivo em "docker compose logs". (Antes ele
      # subia com o segredo de exemplo, que é público.) Ver o README.
      - ./server/.env:/app/server/.env:ro

    healthcheck:
      # Definido no Dockerfile (bate em /api/auth/status). Repetido aqui só
      # para o "docker compose ps" mostrar o estado como "healthy". Roda
      # dentro do container, por HTTP direto no Node: é o único pedido que o
      # servidor aceita sem HTTPS (ver middlewares/exigirHttps.js).
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  proxy:
    image: caddy:2-alpine
    container_name: gestor-de-atualizacoes-proxy
    restart: unless-stopped
    depends_on:
      - gestor
    ports:
      # Só a 443. Sem a 80, "http://" nem responde: ninguém é redirecionado,
      # quem digitar sem "https://" vê conexão recusada (decisão de
      # 29/09/2026: somente HTTPS). Para mudar a porta, só o número da
      # esquerda -- e o endereço passa a ser https://IP:PORTA.
      - "443:443"
    environment:
      # ":?" faz o compose recusar a subida com esta mensagem quando falta o
      # valor -- sem ele, o Caddy subiria atendendo um endereço vazio.
      GESTOR_ENDERECO: ${GESTOR_ENDERECO:?defina GESTOR_ENDERECO no web/.env, ex. GESTOR_ENDERECO=192.168.0.10}
      # Opcional: só para o acesso por https://IP funcionar -- ver o
      # default_sni em proxy/Caddyfile.
      GESTOR_IP: ${GESTOR_IP:-}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # A autoridade certificadora própria (tls internal) e os certificados
      # moram aqui. Perder este volume gera uma raiz NOVA, e todas as
      # máquinas da equipe precisam instalar a raiz de novo.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gestor-data:
  caddy-data:
  caddy-config:
